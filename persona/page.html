<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>现任</title>
<style>
:root{--him:url(/static/him.jpg);--me:url(/static/me.jpg)}
*{box-sizing:border-box}body{margin:0;background:#ededed;font-family:-apple-system,"Microsoft YaHei",sans-serif}
#wrap{max-width:720px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#ededed}
#head{background:#ededed;border-bottom:1px solid #d9d9d9;padding:12px 16px;font-weight:600;color:#333;display:flex;justify-content:space-between;align-items:center}
#head small{color:#999;font-weight:400;font-size:12px}
#clr{border:none;background:none;color:#888;font-size:12px;cursor:pointer;padding:2px 4px}
#msgs{flex:1;overflow-y:auto;padding:12px 16px}
.row{display:flex;margin:10px 0}.row.me{justify-content:flex-end}
.bub{max-width:72%;padding:8px 12px;border-radius:6px;line-height:1.45;white-space:pre-wrap;word-break:break-word;font-size:15px}
.me .bub{background:#95ec69;color:#111}
.ot .bub{background:#fff;color:#111}
.avatar{width:38px;height:38px;border-radius:5px;margin-right:8px;flex:0 0 38px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
.me .avatar{margin:0 0 0 8px;order:2}
.ot .avatar{background-image:var(--him)}
.me .avatar{background-image:var(--me)}
#bar{display:flex;padding:10px;background:#f7f7f7;border-top:1px solid #ddd;gap:8px}
#in{flex:1;resize:none;height:44px;border:none;border-radius:4px;padding:10px;font-size:15px;outline:none}
#send{width:70px;border:none;border-radius:4px;background:#07c160;color:#fff;font-size:15px;cursor:pointer}
.sys{text-align:center;color:#999;font-size:12px;margin:8px 0}
.time{text-align:center;margin:14px 0 6px;color:#b2b2b2;font-size:12px}
#navadmin{font-size:12px;color:#07c160;text-decoration:none;margin-left:8px;border:1px solid #b8ebc9;border-radius:10px;padding:1px 8px}
#navadmin:hover{background:#eafaf0}
#dbg{font-size:12px;color:#888;padding:4px 16px;border-bottom:1px dashed #ddd;display:none;white-space:pre-wrap}
</style></head><body><div id=wrap>
<div id=head><span id=who>…</span><small><span id=stat></span> <a id=navadmin href="/admin">控制台</a>
<a href="/help" target="_blank" class="hdr-link">帮助</a> <button id=clr title="清空记录">清空</button></small></div>
<div id=dbg></div><div id=msgs></div>
<div id=bar><textarea id=in placeholder="说点什么…（/开头 = 修人设，/undo 撤销）"></textarea><button id=send>发送</button></div>
</div><script>
const msgs=document.getElementById('msgs'),inp=document.getElementById('in'),send=document.getElementById('send'),
      dbg=document.getElementById('dbg'),stat=document.getElementById('stat');
let history=[];
let lastTs=0;
function fmtTime(ts){
  const d=new Date(ts*1000), now=new Date();
  const hm=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  if(sameDay(d,now)) return hm;
  const y=new Date(now.getTime()-86400000);
  if(sameDay(d,y)) return '昨天 '+hm;
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function maybeTime(ts){
  if(!ts) return;
  if(lastTs && ts-lastTs<300) return;       // 5 分钟内不重复插
  const d=new Date(ts*1000), p=lastTs?new Date(lastTs*1000):null;
  if(p && p.getFullYear()===d.getFullYear()&&p.getMonth()===d.getMonth()&&p.getDate()===d.getDate()
     && ts-lastTs<300) return;
  const div=document.createElement('div');div.className='time';div.textContent=fmtTime(ts);
  msgs.appendChild(div);
  lastTs=ts;
}
function sys(text){const d=document.createElement('div');d.className='sys';d.textContent=text;
 msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
function bubble(role,text,ts){const r=document.createElement('div');r.className='row '+(role==='user'?'me':'ot');
 r.innerHTML='<div class=avatar></div><div class=bub></div>';r.querySelector('.bub').textContent=text;
 msgs.appendChild(r);msgs.scrollTop=msgs.scrollHeight;return r.querySelector('.bub');}
async function say(){
 const text=inp.value.trim();if(!text)return;inp.value='';
 if(text.startsWith('/')){
   const cmd=text.slice(1).trim();
   if(cmd==='undo'){
     const r=await fetch('/api/persona/undo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:CTX})});const j=await r.json();
     sys((j.ok?'✅ ':'⚠️ ')+j.msg);return;
   }
   if(cmd==='clear'){
     await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:CTX})});msgs.innerHTML='';history=[];sys('已清空对话');return;
   }
   const note=sys('修人设中…');
   try{
     const r=await fetch('/api/persona/patch',{method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({text:cmd,c:CTX})});
     const j=await r.json();note.textContent=(j.ok?'✅ ':'⚠️ ')+j.msg;
   }catch(e){note.textContent='⚠️ 请求失败：'+e;}
   return;
 }
 const tsNow=Math.floor(Date.now()/1000);bubble('user',text,tsNow);const out=bubble('assistant','',tsNow);let acc='';stat.textContent='…';
 const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({text,history,c:CTX})});
 const rd=resp.body.getReader(),dec=new TextDecoder();let buf='';
 while(true){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
  const lines=buf.split('\n\n');buf=lines.pop();
  for(const l of lines){if(!l.startsWith('data: '))continue;const d=l.slice(6);if(d==='[DONE]')continue;
   let j;try{j=JSON.parse(d)}catch(e){continue}
   if(j.memories){dbg.style.display='block';
     dbg.textContent='记忆：'+(j.memories.join(' | ')||'（无）')+'\n事实：'+(j.facts||[]).join(' | ');}
   if(j.delta){acc+=j.delta;out.textContent=acc;msgs.scrollTop=msgs.scrollHeight;}}}
 history.push({role:'user',content:text},{role:'assistant',content:acc});
 stat.textContent=acc.length+' 字';
}
let CTX=null;
async function loadCtx(){
  try{
    const d=await (await fetch('/api/contacts')).json();
    CTX=d.active;
    const me=d.list.find(x=>x.xid===CTX)||d.list.find(x=>x.wxid===CTX)||{};
    document.getElementById('who').textContent=me.name||'对话';
    document.documentElement.style.setProperty('--him',`url(/static/${CTX}/avatars/him.jpg)`);
    document.documentElement.style.setProperty('--me',`url(/static/${CTX}/avatars/me.jpg)`);
  }catch(e){}
}
async function loadHistory(){
 const r=await fetch('/api/history?limit=60&c='+encodeURIComponent(CTX||''));const rows=await r.json();
 for(const m of rows){bubble(m.role==='user'?'user':'assistant',m.content,m.ts);}
 history=rows.map(m=>({role:m.role,content:m.content}));
 lastTs=rows.length?rows[rows.length-1].ts:0;
 if(rows.length){msgs.scrollTop=msgs.scrollHeight;stat.textContent=rows.length+' 条历史';}
}
document.getElementById('clr').onclick=async()=>{
 if(!confirm('清空全部对话记录？'))return;
 await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:CTX})});
 msgs.innerHTML='';history=[];stat.textContent='';dbg.style.display='none';
};
loadCtx().then(loadHistory);
send.onclick=say;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();say();}});
</script></body></html>
